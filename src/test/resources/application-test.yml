server:
  shutdown: immediate
  servlet:
    context-path: /

spring:
  jackson:
    default-property-inclusion: NON_NULL

  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
